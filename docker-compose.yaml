services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=konexio'
      - 'POSTGRES_USER=konexio'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432'
    volumes:
      - './src/main/resources/db/init:/docker-entrypoint-initdb.d:ro'


  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # http://localhost:8025
