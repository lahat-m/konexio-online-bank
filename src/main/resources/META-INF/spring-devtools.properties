# Load Spring Modulith and ArchUnit in devtools' restart classloader, not the
# base one, so a hot restart throws them away along with the application's own
# classes.
#
# Spring Modulith caches its module model in a static field
# (ApplicationModules.CACHE). Left in the base classloader, that cache survives
# a restart and hands back a model built from the previous restart's classes;
# its observability interceptor then fails on the first event listener call:
#
#   InconsistentClassPathException: Can't resolve method
#   CustomerProvisioner.on(com.konexio.bank.identity.CustomerRegistered)
#
# Only matters when devtools restarts the app. A packaged jar has a single
# classloader and never reads this file.
restart.include.spring-modulith=/spring-modulith-[\\w\\d.-]+\\.jar
restart.include.archunit=/archunit-[\\w\\d.-]+\\.jar
restart.include.jmolecules=/jmolecules-[\\w\\d.-]+\\.jar
