spring.application.name=bank

# --- Persistence
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Migrations live flat in db/migration, which Flyway scans by default, and are
# ordered by version rather than by where they sit. Only the placeholder the
# repeatable grants file substitutes needs configuring.
spring.flyway.placeholders.app_role=${DB_APP_ROLE:konexio_app}
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
app.identity.issuer=${IDENTITY_ISSUER:https://api.konexio.example}
app.identity.pepper=${IDENTITY_PEPPER:ZGV2LW9ubHktcGVwcGVyLWRvLW5vdC11c2UtaW4tcHJvZC0wMDE=}
app.identity.jwt.access-token-ttl=10m
app.identity.jwt.step-up-token-ttl=2m
app.identity.jwt.refresh-token-ttl=30d

app.identity.otp.length=6
app.identity.otp.ttl=5m
app.identity.otp.max-attempts=3
app.identity.otp.max-sends=5
app.identity.otp.resend-cooldown=60s
app.identity.otp.sender=${OTP_SENDER:log}
app.identity.otp.log-codes=${OTP_LOG_CODES:false}

app.identity.registration.session-ttl=30m

app.identity.jwt.staff-token-ttl=30m

# The first back-office account, created at startup only when both of these are
# set and no such username exists. Nothing is seeded by a migration: a default
# administrator with a shipped password is a back door in every environment that
# forgets to change it.
app.identity.staff.bootstrap.username=${STAFF_BOOTSTRAP_USERNAME:}
app.identity.staff.bootstrap.password=${STAFF_BOOTSTRAP_PASSWORD:}
app.identity.staff.bootstrap.full-name=${STAFF_BOOTSTRAP_NAME:Konexio Administrator}
app.identity.staff.bootstrap.email=${STAFF_BOOTSTRAP_EMAIL:admin@konexio.example}
app.identity.staff.bootstrap.roles=${STAFF_BOOTSTRAP_ROLES:ADMIN}
app.identity.staff.max-failed-attempts=5
app.identity.staff.lock-duration=30m

app.identity.pin.length=4
app.identity.pin.max-failed-attempts=5
app.identity.pin.lock-duration=30m

app.identity.kyc.provider=${KYC_PROVIDER:stub}
app.identity.kyc.minimum-age-years=18

app.identity.rate-limit.enabled=${IDENTITY_RATE_LIMIT_ENABLED:true}
app.identity.rate-limit.max-requests=30
app.identity.rate-limit.window=1m

# A browser session ends on the clock, not when the access token inside it
# expires: the token is the session's principal rather than a credential the
# browser presents, so this is what actually logs a customer out.
server.servlet.session.timeout=15m

# --- Accounts
app.account.default-currency=KES
app.account.max-savings-accounts=5
app.api-security.idempotency.enabled=${IDEMPOTENCY_ENABLED:true}
app.api-security.idempotency.paths=/api/accounts,\
  /api/deposits,/api/deposits/*/confirmation,\
  /api/withdrawals,/api/withdrawals/*/confirmation,\
  /api/transfers,/api/transfers/*/confirmation,\
  /api/loans

# --- Payments
app.payment.default-currency=KES
app.payment.confirmation-ttl=15m
app.payment.provider=${PAYMENT_PROVIDER:stub}

# The one endpoint that turns an account number into a name.
app.payment.recipient-lookup.max-lookups=20
app.payment.recipient-lookup.window=1m
app.payment.callbacks.allowed-ips=${CALLBACK_ALLOWED_IPS:}
app.payment.callbacks.secret=${CALLBACK_SECRET:}
app.payment.callbacks.signature-header=X-Konexio-Signature

# --- Loans ---
app.loan.credit-reference=${CREDIT_REFERENCE:stub}
app.loan.minimum-credit-score=600
app.loan.installments=1

# --- Notifications
app.notification.relay.enabled=${NOTIFICATION_RELAY_ENABLED:true}
app.notification.relay.interval=2s
app.notification.relay.batch-size=100
app.notification.relay.max-attempts=8
app.notification.relay.backoff=30s

app.notification.email.provider=${EMAIL_PROVIDER:log}
app.notification.email.from=${EMAIL_FROM:Konexio Bank <no-reply@konexio.example>}
app.notification.email.api-key=${RESEND_API_KEY:}

# No SMS gateway is integrated yet; notifications are logged.
app.notification.sms.provider=${SMS_PROVIDER:log}
app.notification.sms.sender-id=KONEXIO

# --- Jobs
app.jobs.enabled=${JOBS_ENABLED:true}
app.jobs.lock-for=10m
app.jobs.batch-size=500
app.jobs.dormancy-period=P12M
app.jobs.loan-reminder-days=3
app.jobs.stuck-payment-after=30m
app.jobs.retention=30d

# --- Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
