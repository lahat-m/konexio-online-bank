# Local development only. Activate with --spring.profiles.active=local, or set
# Active profiles to "local" in the IDE run configuration.
#
# Everything here weakens something on purpose, which is why it is a profile and
# not a default: a deployment that forgets to set a variable gets the safe value
# from application.properties, and has to opt in to these.

# Puts the six digits in the log, so a sign-up can be finished without an SMS
# gateway:
#
#   OTP for +254 7•• ••• 570 is 481923 (valid PT5M). Enabled by
#   app.identity.otp.log-codes — never in production.
#
# An OTP in a log file is an OTP in every system that ships logs, so this must
# never be on anywhere a real customer signs up.
app.identity.otp.log-codes=true


# Turns off Spring Modulith's observability interceptor, which is incompatible
# with devtools' restart classloader. It inspects listener methods through
# ArchUnit, and after a hot restart the model it built and the classes now
# loaded come from two different classloaders — so a listener whose signature is
# plainly there fails to resolve and the request 500s:
#
#   InconsistentClassPathException: Can't resolve method
#   CustomerProvisioner.on(com.konexio.bank.identity.CustomerRegistered)
#
# A packaged jar has one application classloader and does not hit this, so the
# tracing stays on everywhere else.
management.tracing.enabled=false
