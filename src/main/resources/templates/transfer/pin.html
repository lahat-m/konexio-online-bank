<!DOCTYPE html>
<!--/* docs/screens/3.3e PIN */-->
<html th:replace="~{layout :: page(~{::title}, ~{::main})}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enter your PIN</title>
</head>
<body>
<main class="screen">

    <header th:replace="~{fragments/screen :: header('Send money', @{/transfers/review})}"></header>

    <form class="screen__form" method="post" th:action="@{/transfers/pin}" novalidate>

        <div class="screen__body">
            <div class="done">
                <!--/* A bare lock, as this mock draws it, like the withdrawal PIN. */-->
                <span class="done__mark">
                    <svg th:replace="~{fragments/icons :: lock}"></svg>
                </span>
                <h1 class="screen__title done__title">Enter your PIN</h1>
                <!--/*
                  Who and how much, one last time: this is the only screen in the
                  flow where pressing a key spends money, so it repeats what the
                  review said rather than assuming it was read.
                */-->
                <p class="screen__lead done__lead">
                    <span th:text="|To send ${amount} to |">To send KES 3,500.00 to </span><span
                        class="masked-name" th:text="${recipient.maskedName}">Joseph Ot*****</span>
                </p>
            </div>

            <div class="alert alert--error" th:if="${pinError}" role="alert">
                <p th:text="${pinError}"></p>
            </div>

            <!--/* The same keypad as the sign-up, the deposit and the withdrawal. */-->
            <div class="pin" th:attr="data-pin-length=${pinLength}">

                <div class="pin__dots" aria-hidden="true">
                    <span class="pin__dot" th:each="position : ${#numbers.sequence(1, pinLength)}"></span>
                </div>

                <div class="field" th:classappend="${pinError} ? 'field--invalid'">
                    <label class="field__label pin__label" for="pin">Your PIN</label>
                    <input class="field__control pin__input" type="password" id="pin" name="pin"
                           th:attr="maxlength=${pinLength}"
                           inputmode="numeric" autocomplete="current-password" enterkeyhint="done">
                </div>

                <div class="keypad">
                    <button class="keypad__key" type="button" th:each="digit : ${#numbers.sequence(1, 9)}"
                            th:text="${digit}" th:attr="data-digit=${digit}">1</button>
                    <span class="keypad__spacer"></span>
                    <button class="keypad__key" type="button" data-digit="0">0</button>
                    <button class="keypad__key keypad__key--quiet" type="button" data-action="delete"
                            aria-label="Delete last digit">
                        <svg th:replace="~{fragments/icons :: backspace}"></svg>
                    </button>
                </div>

            </div>
        </div>

        <nav class="screen__actions">
            <button class="button button--primary" type="submit" th:text="${sendLabel}">Send KES 3,500.00</button>
            <p class="screen__footnote">
                <a class="link" th:href="@{/forgot-pin}">Forgot PIN?</a>
            </p>
        </nav>

    </form>

    <script th:src="@{/js/pin.js}" defer></script>

</main>
</body>
</html>
