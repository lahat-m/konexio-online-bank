<!DOCTYPE html>
<!--/*
  The icon set, one fragment each, so a screen names an icon instead of carrying
  thirty lines of path data.

  The markup holds only structure: the viewBox and the paths. Size, colour and
  stroke live on .icon in konexio.css, which is why the same drawing can sit in
  a back button and in a checklist and look right in both.

  Used as: <svg th:replace="~{fragments/icons :: phone}"></svg>
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<svg th:fragment="chevron-left" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m15 18-6-6 6-6"/>
</svg>

<svg th:fragment="id-card" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <circle cx="8.5" cy="11" r="1.75"/>
    <path d="M5.75 15.75c.5-1.15 1.55-1.75 2.75-1.75s2.25.6 2.75 1.75"/>
    <path d="M15 10.5h3.5"/>
    <path d="M15 13.5h3.5"/>
</svg>

<svg th:fragment="phone" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="7" y="2" width="10" height="20" rx="2.5"/>
    <path d="M11 18.25h2"/>
</svg>

<svg th:fragment="mail" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2"/>
    <path d="m3 7 9 6 9-6"/>
</svg>

<svg th:fragment="chevron-right" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m9 6 6 6-6 6"/>
</svg>

<svg th:fragment="eye" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
    <circle cx="12" cy="12" r="3"/>
</svg>

<svg th:fragment="arrow-down" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 4v12"/>
    <path d="m6.5 11.5 5.5 5.5 5.5-5.5"/>
    <path d="M5 20h14"/>
</svg>

<svg th:fragment="arrow-up" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 20V8"/>
    <path d="m6.5 12.5 5.5-5.5 5.5 5.5"/>
    <path d="M5 4h14"/>
</svg>

<svg th:fragment="transfer" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9h15"/>
    <path d="m15.5 5.5 3.5 3.5-3.5 3.5"/>
    <path d="M20 15H5"/>
    <path d="m8.5 11.5-3.5 3.5 3.5 3.5"/>
</svg>

<svg th:fragment="card" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
    <circle cx="12" cy="12" r="1.75"/>
</svg>

<svg th:fragment="home" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 10.5 12 4l8 6.5V20H4Z"/>
</svg>

<svg th:fragment="list" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 6.5h11"/>
    <path d="M9 12h11"/>
    <path d="M9 17.5h11"/>
    <path d="M4.5 6.5h.01"/>
    <path d="M4.5 12h.01"/>
    <path d="M4.5 17.5h.01"/>
</svg>

<svg th:fragment="wallet" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
    <path d="M2.5 10h19"/>
</svg>

<svg th:fragment="cross" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m6.5 6.5 11 11"/>
    <path d="m17.5 6.5-11 11"/>
</svg>

<svg th:fragment="alert" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7.5v5.25"/>
    <path d="M12 16.5h.01"/>
</svg>

<svg th:fragment="clock" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5.25l3.25 2"/>
</svg>

<svg th:fragment="info" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 11v5.5"/>
    <path d="M12 7.75h.01"/>
</svg>

<svg th:fragment="store" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 9.5h17V20h-17z"/>
    <path d="M3 9.5 4.75 4.5h14.5L21 9.5"/>
    <path d="M9.5 20v-5h5v5"/>
</svg>

<svg th:fragment="check" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="m4.5 12.5 5 5 10-11"/>
</svg>

<svg th:fragment="backspace" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M21 5H9.5L3 12l6.5 7H21a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 21 5Z"/>
    <path d="m12.5 9.5 5 5"/>
    <path d="m17.5 9.5-5 5"/>
</svg>

<svg th:fragment="lock" class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="4.5" y="10" width="15" height="11" rx="2.5"/>
    <path d="M8.25 10V7a3.75 3.75 0 0 1 7.5 0v3"/>
</svg>

</body>
</html>
